<text x="1208" y="705" font-size="12" font-weight="bold" fill="#111">GND</text>
<text x="380" y="740" font-size="11.5" font-weight="bold" fill="#111">Un solo carril de masa: el hilo azul, las dos 27 k, el GND del ESP32, las cuatro 10 k y las cuatro patas 2.</text>
<line x1="28" y1="786" x2="1212" y2="786" stroke="#ddd" stroke-width="1"/>
<text x="28" y="810" font-size="12" fill="#333"><tspan font-weight="bold">Patas 1 y 2:</tspan>  la 1 recibe la corriente desde la resistencia de 320 Ω; la 2 baja al carril de masa. Son el LED que hay dentro del chip, y por eso van en el mismo lado.</text>
<text x="28" y="832" font-size="12" fill="#333"><tspan font-weight="bold">Patas 3 y 4:</tspan>  van al pulsador del mando, a sus dos patas EN DIAGONAL. NUNCA a las patas 1 y 2, que ya llevan el ESP32. Si no responde, invierte esos dos cables.</text>
<text x="28" y="856" font-size="12" fill="#333"><tspan font-weight="bold">Con cada chip puesto:</tspan>  pata 1 con pata 2 no debe pitar, pata 3 con pata 4 tampoco. Si pitan, ese chip esta a lo largo y la protoboard une sus patas.</text>
<text x="28" y="878" font-size="12" fill="#333"><tspan font-weight="bold">Al medir, en ohmios y NO en continuidad:</tspan>  en reposo marca OL; durante el pulso baja a unos 150 Ω. Componentes: 4 × PC817, 4 × 320 Ω, 4 × 10 kΩ.</text>

