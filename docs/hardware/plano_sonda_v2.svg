<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="980" height="900" font-family="Helvetica, Arial, sans-serif">

  <rect width="980" height="900" fill="#ffffff"/>

  <!-- ============================ title ============================ -->
  <text x="28" y="38" font-size="21" font-weight="bold" fill="#111">Sonda del bus — divisor 9.1 k / 27 k</text>
  <text x="28" y="60" font-size="12.5" fill="#555">ADR-016 · único plano vigente. El anterior es plano_divisores_v1_NO_MONTAR.svg, y no se monta.</text>

  <!-- ============================ handset ============================ -->
  <rect x="24" y="92" width="120" height="720" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  <text x="84" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">MANDO</text>
  <text x="84" y="135" font-size="11" text-anchor="middle" fill="#555">JK-CH506</text>
  <text x="84" y="151" font-size="11" text-anchor="middle" fill="#555">conector JST</text>
  <text x="84" y="178" font-size="10" text-anchor="middle" fill="#777">no se corta nada:</text>
  <text x="84" y="192" font-size="10" text-anchor="middle" fill="#777">se sueldan hilos</text>
  <text x="84" y="206" font-size="10" text-anchor="middle" fill="#777">con el conector</text>
  <text x="84" y="220" font-size="10" text-anchor="middle" fill="#777">original puesto</text>

  <!-- ============================ ESP32 ============================ -->
  <rect x="790" y="92" width="164" height="720" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  <text x="872" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">ESP32</text>
  <text x="872" y="135" font-size="11" text-anchor="middle" fill="#555">bornera</text>
  <text x="872" y="784" font-size="10" text-anchor="middle" fill="#777">alimentado por USB</text>
  <text x="872" y="798" font-size="10" text-anchor="middle" fill="#777">(ADR-007 / ADR-019)</text>

  <!-- ==================================================================
       ROJO — CLK
       ================================================================== -->
  <line x1="144" y1="200" x2="320" y2="200" stroke="#d32f2f" stroke-width="3"/>
  <text x="152" y="192" font-size="12" font-weight="bold" fill="#d32f2f">ROJO — CLK</text>

  <rect x="320" y="184" width="86" height="32" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="363" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">9.1 kΩ</text>
  <text x="363" y="174" font-size="10" text-anchor="middle" fill="#2e7d32">ya en el cajón</text>

  <line x1="406" y1="200" x2="790" y2="200" stroke="#333" stroke-width="3"/>
  <circle cx="580" cy="200" r="5.5" fill="#333"/>
  <text x="690" y="192" font-size="13" font-weight="bold" fill="#111">→ P18</text>
  <text x="690" y="220" font-size="11" fill="#1565c0">2.99 V</text>
  <text x="440" y="238" font-size="11" fill="#1565c0">bus: 3.99 V</text>

  <line x1="580" y1="200" x2="580" y2="262" stroke="#333" stroke-width="3"/>
  <rect x="564" y="262" width="32" height="88" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="614" y="300" font-size="14" font-weight="bold" fill="#111">27 kΩ</text>
  <text x="614" y="316" font-size="10" fill="#c62828">hay que comprarla</text>
  <!-- baja hasta la barra de masa, saltando la linea verde sin tocarla -->
  <line x1="580" y1="350" x2="580" y2="432" stroke="#333" stroke-width="3"/>
  <path d="M 580 432 A 9 9 0 0 1 580 450" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="580" y1="450" x2="580" y2="700" stroke="#333" stroke-width="3"/>

  <!-- ==================================================================
       VERDE — DIO
       ================================================================== -->
  <line x1="144" y1="441" x2="320" y2="441" stroke="#2e7d32" stroke-width="3"/>
  <text x="152" y="433" font-size="12" font-weight="bold" fill="#2e7d32">VERDE — DIO</text>

  <rect x="320" y="425" width="86" height="32" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="363" y="446" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">9.1 kΩ</text>
  <text x="363" y="415" font-size="10" text-anchor="middle" fill="#2e7d32">ya en el cajón</text>

  <line x1="406" y1="441" x2="565" y2="441" stroke="#333" stroke-width="3"/>
  <line x1="595" y1="441" x2="790" y2="441" stroke="#333" stroke-width="3"/>
  <circle cx="500" cy="441" r="5.5" fill="#333"/>
  <text x="690" y="433" font-size="13" font-weight="bold" fill="#111">→ P4</text>
  <text x="690" y="461" font-size="11" fill="#1565c0">2.99 V</text>
  <text x="418" y="479" font-size="11" fill="#1565c0">bus: 3.99 V</text>

  <line x1="500" y1="441" x2="500" y2="503" stroke="#333" stroke-width="3"/>
  <rect x="484" y="503" width="32" height="88" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="534" y="541" font-size="14" font-weight="bold" fill="#111">27 kΩ</text>
  <text x="534" y="557" font-size="10" fill="#c62828">hay que comprarla</text>
  <line x1="500" y1="591" x2="500" y2="700" stroke="#333" stroke-width="3"/>

  <!-- ==================================================================
       AZUL — GND del mando
       ================================================================== -->
  <line x1="144" y1="640" x2="420" y2="640" stroke="#1565c0" stroke-width="3"/>
  <line x1="420" y1="640" x2="420" y2="700" stroke="#1565c0" stroke-width="3"/>
  <text x="152" y="632" font-size="12" font-weight="bold" fill="#1565c0">AZUL — GND del mando</text>

  <!-- ==================================================================
       BARRA DE MASA — una sola
       ================================================================== -->
  <rect x="404" y="694" width="386" height="12" rx="2" fill="#333"/>
  <circle cx="420" cy="700" r="7" fill="#1565c0" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="700" r="7" fill="#333" stroke="#fff" stroke-width="2"/>
  <circle cx="580" cy="700" r="7" fill="#333" stroke="#fff" stroke-width="2"/>
  <line x1="790" y1="700" x2="790" y2="700" stroke="#333" stroke-width="3"/>
  <text x="690" y="688" font-size="13" font-weight="bold" fill="#111">→ GND</text>

  <line x1="742" y1="706" x2="742" y2="738" stroke="#333" stroke-width="3"/>
  <line x1="720" y1="738" x2="764" y2="738" stroke="#333" stroke-width="3"/>
  <line x1="728" y1="746" x2="756" y2="746" stroke="#333" stroke-width="3"/>
  <line x1="735" y1="754" x2="749" y2="754" stroke="#333" stroke-width="3"/>

  <rect x="150" y="712" width="240" height="76" rx="5" fill="#fffbe6" stroke="#f9a825" stroke-width="1.5"/>
  <text x="162" y="732" font-size="12" font-weight="bold" fill="#111">LA MASA ES UNA SOLA</text>
  <text x="162" y="750" font-size="10.5" fill="#444">Las cuatro cosas van al mismo punto:</text>
  <text x="162" y="765" font-size="10.5" fill="#444">hilo azul · pie del 27 k de CLK ·</text>
  <text x="162" y="780" font-size="10.5" fill="#444">pie del 27 k de DIO · GND del ESP32.</text>

  <text x="420" y="732" font-size="10.5" fill="#555">En protoboard: el carril negativo. Ahí entran los cuatro.</text>
  <text x="420" y="748" font-size="10.5" fill="#555">Sin esa referencia común, el divisor no divide nada</text>
  <text x="420" y="764" font-size="10.5" fill="#555">y la medida del ESP32 no significa nada (ADR-007).</text>

  <!-- ==================================================================
       AMARILLO — no se conecta
       ================================================================== -->
  <line x1="144" y1="840" x2="290" y2="840" stroke="#f9a825" stroke-width="3"/>
  <text x="152" y="832" font-size="12" font-weight="bold" fill="#b8860b">AMARILLO — 5 V</text>
  <line x1="278" y1="828" x2="302" y2="852" stroke="#c62828" stroke-width="4"/>
  <line x1="302" y1="828" x2="278" y2="852" stroke="#c62828" stroke-width="4"/>
  <text x="320" y="838" font-size="14" font-weight="bold" fill="#c62828">NO SE CONECTA. NO SE SUELDA.</text>
  <text x="320" y="856" font-size="10.5" fill="#555">5 V contra un GPIO que tolera 3.6 V. Ni en esta fase ni en ninguna.</text>

  <line x1="144" y1="876" x2="954" y2="876" stroke="#ddd" stroke-width="1"/>
  <text x="144" y="896" font-size="11.5" font-weight="bold" fill="#c62828">El GPIO va al nodo del medio, entre las dos resistencias. Nunca a un extremo.</text>
</svg>
