<text x="70" y="690" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2c6fb5" text-anchor="start" font-weight="bold">Si el ESP32 se queda sin corriente, el bus ni se entera: el buffer lo alimenta el propio mando.</text>
