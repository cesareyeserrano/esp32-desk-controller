<text x="125" y="383" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9a227" text-anchor="middle" font-weight="bold">+5V</text>
<text x="755" y="383" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9a227" text-anchor="middle" font-weight="bold">+5V</text>
<line x1="180" y1="378" x2="700" y2="378" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
<text x="440" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2c6fb5" text-anchor="middle" font-weight="bold">PASO DIRECTO — pistas anchas, el bus nunca se corta</text>
<circle cx="300" cy="260" r="5" fill="#c0392b"/>
<circle cx="300" cy="300" r="5" fill="#27865a"/>
<circle cx="340" cy="340" r="5" fill="#2c6fb5"/>
<circle cx="380" cy="378" r="5" fill="#c9a227"/>
