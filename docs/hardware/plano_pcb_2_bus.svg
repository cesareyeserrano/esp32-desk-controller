<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="55" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#111" text-anchor="start" font-weight="bold">LÁMINA 2 / 3 — Lectura del bus</text>
<text x="50" y="84" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#666" text-anchor="start" font-weight="normal">Los 4 hilos cruzan la placa sin tocarse. De dos de ellos se toma una copia para el ESP32.</text>
<rect x="70" y="150" width="110" height="240" fill="#eef4fb" stroke="#2c6fb5" stroke-width="3" rx="8"/>
<text x="125" y="180" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#2c6fb5" text-anchor="middle" font-weight="bold">J1</text>
<text x="125" y="202" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2c6fb5" text-anchor="middle" font-weight="normal">BUS-IN</text>
<text x="125" y="220" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666" text-anchor="middle" font-weight="normal">de la caja</text>
<rect x="700" y="150" width="110" height="240" fill="#eef4fb" stroke="#2c6fb5" stroke-width="3" rx="8"/>
<text x="755" y="180" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#2c6fb5" text-anchor="middle" font-weight="bold">J2</text>
<text x="755" y="202" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2c6fb5" text-anchor="middle" font-weight="normal">BUS-OUT</text>
<text x="755" y="220" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666" text-anchor="middle" font-weight="normal">al mando</text>
<text x="125" y="265" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">CLK</text>
<text x="755" y="265" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">CLK</text>
<line x1="180" y1="260" x2="700" y2="260" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<text x="125" y="305" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#27865a" text-anchor="middle" font-weight="bold">DIO</text>
<text x="755" y="305" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#27865a" text-anchor="middle" font-weight="bold">DIO</text>
<line x1="180" y1="300" x2="700" y2="300" stroke="#27865a" stroke-width="5" stroke-linecap="round"/>
