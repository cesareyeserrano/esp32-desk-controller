<text x="400" y="485" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal">CLK:  inv1 ▸ inv2</text>
<text x="400" y="510" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#27865a" text-anchor="middle" font-weight="normal">DIO:  inv3 ▸ inv4</text>
